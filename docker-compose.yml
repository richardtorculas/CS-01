# Local development only. Production configuration lives in the hosting platform's environment.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ugnay
      POSTGRES_PASSWORD: ugnay
      POSTGRES_DB: ugnay
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ugnay -d ugnay"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://ugnay:ugnay@db:5432/ugnay
      # Local-only placeholder; override in api/.env or the shell for anything shared.
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-not-for-deployment}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app

volumes:
  db-data:
